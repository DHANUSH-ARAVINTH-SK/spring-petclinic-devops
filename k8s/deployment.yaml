apiVersion: apps/v1
kind: Deployment

metadata:
  name: petclinic-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: petclinic

  template:
    metadata:
      labels:
        app: petclinic

    spec:
      containers:
      - name: petclinic
        image: aravinth175/spring-petclinic:latest
        ports:
        - containerPort: 8080